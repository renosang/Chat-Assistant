<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Hub - Admin Control</title>

    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/x-icon;base64,AA">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #f8fafc;
            --sidebar-bg: #0b0f19;
            --card-border: #f1f5f9;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #1e293b;
            letter-spacing: -0.01em;
        }

        .dark-sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.2);
        }

        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .sidebar-active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white !important;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
            position: relative;
        }

        .sidebar-active::after {
            content: '';
            position: absolute;
            left: 0;
            top: 25%;
            height: 50%;
            width: 4px;
            background: #ffffff;
            border-radius: 0 4px 4px 0;
        }

        .bento-card {
            background: white;
            border-radius: 28px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.08);
            border-color: rgba(99, 102, 241, 0.15);
        }

        .metric-card {
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-gradient, linear-gradient(90deg, var(--primary), var(--secondary)));
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input,
        textarea {
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid #e2e8f0;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
            background-color: white;
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* SKELETON SCREEN */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 12px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-row {
            height: 60px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
        }

        .pulse-live {
            position: relative;
            display: inline-flex;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color, #10b981);
        }

        .pulse-live::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--color, #10b981);
            animation: pulse-anim 2s infinite;
        }

        @keyframes pulse-anim {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        /* PREMIUM ANIMATIONS */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes avatarGlow {
            0%, 100% {
                box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.3);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.25), 0 0 20px rgba(16, 185, 129, 0.3);
            }
        }

        .avatar-glow-online {
            animation: avatarGlow 3s infinite ease-in-out;
        }

        .device-list-container {
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Shimmer reflection effect on buttons */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(30deg);
            transition: transform 0.5s ease;
            pointer-events: none;
        }
        .btn-shimmer:hover::after {
            transform: translate(300%, -30%) rotate(30deg);
        }
    </style>
</head>

<body>
    <div id="root">
        <!-- IMMEDIATE RENDER SKELETON -->
        <div class="flex flex-col h-screen bg-[#f1f5f9]">
            <header class="w-full bg-white px-8 py-4 flex items-center justify-between border-b border-slate-200/50">
                <div class="h-8 w-40 skeleton"></div>
                <div class="h-8 w-32 skeleton"></div>
            </header>
            <main class="flex-1 p-12 space-y-12">
                <div class="flex justify-between items-end">
                    <div class="space-y-3">
                        <div class="h-10 w-48 skeleton"></div>
                        <div class="h-4 w-64 skeleton"></div>
                    </div>
                    <div class="h-12 w-40 skeleton"></div>
                </div>
                <div class="bento-card p-10 space-y-6">
                    <div class="skeleton-row">
                        <div class="flex-1 skeleton"></div>
                        <div class="flex-1 skeleton"></div>
                        <div class="w-20 skeleton"></div>
                    </div>
                    <div class="skeleton-row">
                        <div class="flex-1 skeleton"></div>
                        <div class="flex-1 skeleton"></div>
                        <div class="w-20 skeleton"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="text/babel">
        const API_BASE = '/api/admin';

        function App() {
            const [view, setView] = React.useState('users');
            const [isLoggedIn, setIsLoggedIn] = React.useState(localStorage.getItem('adminToken') === 'true');

            if (!isLoggedIn) return <LoginView onLogin={() => setIsLoggedIn(true)} />;

            const logout = () => {
                localStorage.removeItem('adminToken');
                setIsLoggedIn(false);
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden bg-[#f1f5f9]">
                    {/* Top Navigation Header */}
                    <header className="w-full bg-white/70 backdrop-blur-md text-slate-800 px-8 py-4 flex items-center justify-between border-b border-slate-200/50 z-20 shadow-sm">
                        <div className="flex items-center gap-8">
                            <h1 className="text-xl font-extrabold tracking-tight flex items-center gap-3 select-none">
                                <div className="w-8 h-8 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center text-white text-base shadow-lg shadow-indigo-500/30">O</div>
                                <span className="text-slate-900 font-bold">Onpoint Hub</span>
                            </h1>
                            <nav className="flex items-center gap-1.5 bg-slate-100/80 p-1 rounded-xl border border-slate-200/40">
                                <button onClick={() => setView('users')} className={`px-4 py-2 rounded-lg text-xs font-extrabold transition-all duration-300 ${view === 'users' ? 'bg-white text-indigo-600 shadow-sm border border-slate-200/20' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Nhân viên
                                </button>
                                <button onClick={() => setView('settings')} className={`px-4 py-2 rounded-lg text-xs font-extrabold transition-all duration-300 ${view === 'settings' ? 'bg-white text-indigo-600 shadow-sm border border-slate-200/20' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Cấu hình
                                </button>
                                <button onClick={() => setView('audit')} className={`px-4 py-2 rounded-lg text-xs font-extrabold transition-all duration-300 ${view === 'audit' ? 'bg-white text-indigo-600 shadow-sm border border-slate-200/20' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Nhật ký hoạt động
                                </button>
                            </nav>
                        </div>
                        <div className="flex items-center gap-6">
                            <div className="text-xs font-bold text-slate-550 flex items-center gap-2.5 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200/30">
                                <div className="pulse-live"></div>
                                <span className="text-slate-600">Live Realtime</span>
                            </div>
                            <button onClick={logout} className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold text-red-500 hover:bg-red-50 border border-transparent hover:border-red-100 transition-all duration-200">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                                Đăng xuất
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-8 md:p-12">
                        <div className="max-w-7xl mx-auto">
                            {view === 'users' ? <UserManagement /> : view === 'settings' ? <SettingsEditor /> : <AuditLogsView />}
                        </div>
                    </main>
                </div>
            );
        }

        function LoginView({ onLogin }) {
            const [pass, setPass] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    const res = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pass })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('adminToken', 'true');
                        onLogin();
                    } else {
                        setError(data.error);
                    }
                } catch (e) {
                    setError('Lỗi kết nối server');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="h-screen w-full flex items-center justify-center bg-[#f1f5f9]">
                    <div className="bento-card p-12 w-full max-w-md space-y-8 shadow-2xl">
                        <div className="text-center space-y-2">
                            <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-3xl shadow-xl mx-auto mb-6">O</div>
                            <h2 className="text-3xl font-black text-slate-900">Admin Control</h2>
                            <p className="text-slate-500 font-medium">Nhập mật khẩu quản trị để tiếp tục</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="space-y-2">
                                <input
                                    type="password"
                                    className="w-full px-6 py-4 rounded-2xl bg-slate-50"
                                    placeholder="Mật khẩu Admin"
                                    value={pass}
                                    onChange={e => setPass(e.target.value)}
                                    autoFocus
                                />
                                {error && <p className="text-red-500 text-xs font-bold pl-2">⚠️ {error}</p>}
                            </div>
                            <button
                                disabled={loading}
                                className="w-full py-4 bg-slate-900 text-white font-black rounded-2xl hover:bg-indigo-600 transition-all shadow-xl disabled:bg-slate-300"
                            >
                                {loading ? 'Đang xác thực...' : 'Đăng nhập'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function UserManagement() {
            const [users, setUsers] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [showAdd, setShowAdd] = React.useState(false);
            const [newUser, setNewUser] = React.useState({ username: '', password: '', fullName: '' });
            const [searchTerm, setSearchTerm] = React.useState('');
            const [expandedUsers, setExpandedUsers] = React.useState({});
            const [editingUserId, setEditingUserId] = React.useState(null);
            const [editNameValue, setEditNameValue] = React.useState('');

            const fetchUsers = async (isBackground = false) => {
                if (!isBackground) setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/users`);
                    const data = await res.json();
                    setUsers(Array.isArray(data) ? data : []);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                fetchUsers(); // Lần đầu hiện loading

                // Cơ chế Realtime: Polling mỗi 5 giây
                const interval = setInterval(() => {
                    fetchUsers(true); // Auto-refresh im lặng
                }, 5000);

                return () => clearInterval(interval);
            }, []);

            const isUserOnline = (lastActiveAt) => {
                if (!lastActiveAt) return false;
                return (Date.now() - new Date(lastActiveAt).getTime()) < 120000; // 2 phút là Offline
            };

            const toggleStatus = async (id, currentStatus) => {
                await fetch(`${API_BASE}/users`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, isActive: !currentStatus }) });
                fetchUsers(true);
            };

            const toggleBlockTicket = async (id, currentStatus) => {
                await fetch(`${API_BASE}/users`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, blockComplaintTicket: !currentStatus }) });
                fetchUsers(true);
            };

            const deleteUser = async (id) => {
                if (!confirm("Xóa vĩnh viễn nhân viên này cùng toàn bộ thiết bị?")) return;
                await fetch(`${API_BASE}/users?id=${id}`, { method: 'DELETE' });
                fetchUsers(true);
            };

            const forceLogoutDevice = async (userId, deviceId) => {
                if (!confirm("Đăng xuất và xóa thiết bị này khỏi tài khoản?")) return;
                const res = await fetch(`${API_BASE}/users`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: userId, removeDeviceId: deviceId })
                });
                if (res.ok) {
                    fetchUsers(true);
                }
            };

            const startEditing = (userId, currentName) => {
                setEditingUserId(userId);
                setEditNameValue(currentName || '');
            };

            const saveFullName = async (userId) => {
                await fetch(`${API_BASE}/users`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: userId, fullName: editNameValue })
                });
                setEditingUserId(null);
                fetchUsers(true);
            };

            const toggleExpand = (userId) => {
                setExpandedUsers(prev => ({
                    ...prev,
                    [userId]: !prev[userId]
                }));
            };

            const addUser = async (e) => {
                e.preventDefault();
                const res = await fetch(`${API_BASE}/users`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newUser) });
                if (res.ok) { setShowAdd(false); setNewUser({ username: '', password: '', fullName: '' }); fetchUsers(true); }
            };

            // SEARCH & ANALYTICS LOGIC
            const filteredUsers = users.filter(u => u.username?.toLowerCase().includes(searchTerm.toLowerCase()));
            const stats = {
                total: users.length,
                online: users.filter(u => isUserOnline(u.lastActiveAt)).length,
                setup: users.filter(u => !u.isUninstalled).length,
                setupRate: users.length ? Math.round((users.filter(u => !u.isUninstalled).length / users.length) * 100) : 0
            };

            const formatDate = (date) => {
                if (!date) return '---';
                const d = new Date(date);
                return d.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
            };

            const timeAgo = (date) => {
                if (!date) return '---';
                const seconds = Math.floor((new Date() - new Date(date)) / 1000);
                if (seconds < 60) return 'Vừa xong';
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) return `${minutes} phút trước`;
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours} giờ trước`;
                return formatDate(date);
            };

            const getOSIcon = (deviceName) => {
                if (!deviceName) return (
                    <svg className="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                );
                const lower = deviceName.toLowerCase();
                if (lower.includes('windows')) return (
                    <svg className="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M0 3.449L9.75 2.1v9.451H0m10.95-9.6L24 0v11.4H10.95M0 12.6h9.75v9.451L0 20.699M10.95 12.6H24V24l-13.05-1.8" />
                    </svg>
                );
                if (lower.includes('mac') || lower.includes('ios')) return (
                    <svg className="w-5 h-5 text-slate-700" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.62-.75 1.04-1.8 1-2.85-.92.04-2.07.62-2.73 1.39-.58.67-1.09 1.74-.96 2.78 1.03.08 2.1-.56 2.69-1.32z"/>
                    </svg>
                );
                if (lower.includes('android')) return (
                    <svg className="w-5 h-5 text-emerald-500" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 18c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1s1-.45 1-1v-3h4v3c0 .55.45 1 1 1s1-.45 1-1v-3h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.68 1.23 12.38 1 11 1s-2.68.23-3.64.63L5.88.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.3 1.3C4.59 3.29 3 5.46 3 8h16c0-2.54-1.59-4.71-3.47-5.84zM9 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                    </svg>
                );
                return (
                    <svg className="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                );
            };

            const getAvatarGradient = (username, fullName) => {
                const name = fullName || username || '';
                let hash = 0;
                for (let i = 0; i < name.length; i++) {
                    hash = name.charCodeAt(i) + ((hash << 5) - hash);
                }
                const gradients = [
                    'bg-gradient-to-br from-blue-500 to-indigo-600',
                    'bg-gradient-to-br from-purple-500 to-pink-600',
                    'bg-gradient-to-br from-rose-500 to-orange-600',
                    'bg-gradient-to-br from-emerald-500 to-teal-600',
                    'bg-gradient-to-br from-cyan-500 to-blue-600',
                    'bg-gradient-to-br from-amber-500 to-red-600',
                    'bg-gradient-to-br from-fuchsia-500 to-pink-600',
                    'bg-gradient-to-br from-violet-500 to-purple-600'
                ];
                const index = Math.abs(hash) % gradients.length;
                return gradients[index];
            };

            return (
                <div className="space-y-8">
                    {/* STATS BENTO CARDS */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bento-card metric-card p-8 flex justify-between items-center" style={{ '--accent-gradient': 'linear-gradient(90deg, #6366f1, #4f46e5)' }}>

                messages: DEFAULT_MOTIVATION_MESSAGES
            });
            const [categories, setCategories] = React.useState([]);
            const [catLoading, setCatLoading] = React.useState(false);
            const [catMappings, setCatMappings] = React.useState({});
            const [catSearchQuery, setCatSearchQuery] = React.useState('');
            const [rawChannelInputs, setRawChannelInputs] = React.useState({});

            const fetchCategories = async () => {
                setCatLoading(true);
                try {
                    let list = null;
                    const urls = [
                        '/api/categories',
                        'http://localhost:5000/api/categories',
                        'https://macro.beegadget.net/api/categories'
                    ];
                    for (const url of urls) {
                        try {
                            const res = await fetch(url);
                            if (res && res.ok) {
                                const data = await res.json();
                                if (Array.isArray(data)) {
                                    list = data;
                                    break;
                                }
                            }
                        } catch (err) {}
                    }
                    if (list) {
                        setCategories(list);
                    }
                } catch (e) {
                    console.error("Lỗi khi tải danh mục:", e);
                } finally {
                    setCatLoading(false);
                }
            };

            React.useEffect(() => {
                fetch(`${API_BASE}/settings`).then(r => r.json()).then(d => {
                    const initialMappings = Array.isArray(d.brandMappings) ? d.brandMappings : [];

                    setData({ ...d, brandMappings: initialMappings });
                    setBuffers({
                        allBrands: (d.allBrands || []).join('\n'),
                        allMarketplaces: (d.allMarketplaces || []).join('\n'),
                        brandGroups: (d.brandGroups || []).map(g => Array.isArray(g) ? g.join(', ') : g).join('\n'),
                        forbiddenRules: (d.forbiddenRules?.VI || []).map(r => r.word + (r.exception ? ` | ${r.exception}` : '')).join('\n'),
                        typoDictionary: (d.typoDictionary || []).map(r => `${r.error} | ${r.fix}`).join('\n'),
                        brandMappings: initialMappings.map(r => `${r.brand} | ${r.platform}`).join('\n')
                    });

                    // Build initial category mapping dictionary & raw input state
                    const mapDict = {};
                    const rawInputs = {};
                    (d.categoryChannelMappings || []).forEach(m => {
                        mapDict[m.categoryId] = {
                            isAllChannels: m.isAllChannels ?? false,
                            appliedChannels: m.appliedChannels || []
                        };
                        rawInputs[m.categoryId] = (m.appliedChannels || []).join(', ');
                    });
                    setCatMappings(mapDict);
                    setRawChannelInputs(rawInputs);
                    if (d.motivationConfig) {
                        setMotivationConfig({
                            isEnabled: true,
                            intervalSeconds: 12,
                            displayMode: 'sequential',
                            theme: 'indigo',
                            showMascot: true,
                            messages: DEFAULT_MOTIVATION_MESSAGES,
                            ...d.motivationConfig
                        });
                    }
                });

                fetchCategories();
            }, []);

            const handleSave = async () => {
                setSaving(true);
                const updatedData = { ...data };
                updatedData.allBrands = buffers.allBrands.split('\n').map(x => x.trim()).filter(Boolean);
                updatedData.allMarketplaces = buffers.allMarketplaces.split('\n').map(x => x.trim()).filter(Boolean);
                updatedData.brandGroups = buffers.brandGroups.split('\n').map(line => line.split(',').map(item => item.trim()).filter(Boolean)).filter(group => group.length > 0);
                updatedData.forbiddenRules = { VI: buffers.forbiddenRules.split('\n').map(l => { const [w, ex] = l.split('|'); return { word: w?.trim(), exception: ex?.trim() }; }).filter(r => r.word) };
                updatedData.typoDictionary = buffers.typoDictionary.split('\n').map(l => { const [err, fix] = l.split('|'); return { error: err?.trim(), fix: fix?.trim() }; }).filter(r => r.error && r.fix);
                updatedData.brandMappings = buffers.brandMappings.split('\n').map(l => { const [b, p] = l.split('|'); return { brand: b?.trim(), platform: p?.trim() }; }).filter(r => r.brand && r.platform);
                updatedData.motivationConfig = motivationConfig;

                // Build category channel mappings array (only for parent categories)
                const parentCats = categories.filter(c => !c.parent);
                updatedData.categoryChannelMappings = parentCats.map(c => {
                    const m = catMappings[c._id] || {};
                    const isMacroChung = c.name.toLowerCase().includes('macro chung') || c.name.toLowerCase() === 'macrochung';
                    return {
                        categoryId: c._id,
                        categoryName: c.name,
                        appliedChannels: m.appliedChannels || [],
                        isAllChannels: m.isAllChannels ?? isMacroChung
                    };
                });

                const res = await fetch(`${API_BASE}/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updatedData) });
                if (res.ok) {
                    const saved = await res.json();
                    setData(saved);
                    alert("Đã lưu cấu hình thành công!");
                }
                setSaving(false);
            };

            const toggleAllChannels = (catId, catName) => {
                const isMacroChung = catName.toLowerCase().includes('macro chung') || catName.toLowerCase() === 'macrochung';
                setCatMappings(prev => {
                    const current = prev[catId] || { isAllChannels: isMacroChung, appliedChannels: [] };
                    return {
                        ...prev,
                        [catId]: {
                            ...current,
                            isAllChannels: !current.isAllChannels
                        }
                    };
                });
            };

            const updateAppliedChannels = (catId, rawStr, catName) => {
                setRawChannelInputs(prev => ({ ...prev, [catId]: rawStr }));
                const isMacroChung = catName.toLowerCase().includes('macro chung') || catName.toLowerCase() === 'macrochung';
                const channelsList = rawStr.split(/,|\n/).map(s => s.trim()).filter(Boolean);
                setCatMappings(prev => {
                    const current = prev[catId] || { isAllChannels: isMacroChung, appliedChannels: [] };
                    return {
                        ...prev,
                        [catId]: {
                            ...current,
                            appliedChannels: channelsList
                        }
                    };
                });
            };

            const toggleQuickChannel = (catId, channelTag, catName) => {
                const isMacroChung = catName.toLowerCase().includes('macro chung') || catName.toLowerCase() === 'macrochung';
                setCatMappings(prev => {
                    const current = prev[catId] || { isAllChannels: isMacroChung, appliedChannels: [] };
                    let list = [...(current.appliedChannels || [])];
                    if (list.includes(channelTag)) {
                        list = list.filter(c => c !== channelTag);
                    } else {
                        list.push(channelTag);
                    }
                    setRawChannelInputs(rPrev => ({ ...rPrev, [catId]: list.join(', ') }));
                    return {
                        ...prev,
                        [catId]: {
                            ...current,
                            appliedChannels: list
                        }
                    };
                });
            };

            if (!data) return <div className="p-20 text-center font-bold">LOADING...</div>;

            return (
                <div className="space-y-8">
                    <header className="flex justify-between items-end">
                        <div>
                            <h2 className="text-4xl font-black text-slate-900">Cấu hình</h2>
                            <p className="text-slate-500 font-medium">Thiết lập bộ lọc và phân quyền danh mục theo Channel toàn hệ thống</p>
                        </div>
                        <button onClick={handleSave} disabled={saving} className="px-8 py-3.5 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 transition-all flex items-center gap-2.5 disabled:bg-slate-300">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>{saving ? 'Đang lưu...' : 'Lưu tất cả'}</span>
                        </button>
                    </header>
                    <div className="bg-white p-1.5 rounded-2xl flex gap-1 w-fit shadow-sm border border-slate-100 flex-wrap">
                        {['categories', 'mappings', 'motivation', 'brands', 'groups', 'forbidden', 'typo'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`px-6 py-3 rounded-xl text-xs font-extrabold transition-all ${activeTab === t ? 'bg-slate-900 text-white shadow-md' : 'text-slate-500 hover:text-slate-800'}`}>
                                {t === 'categories' ? 'DANH MỤC & CHANNEL' : t === 'mappings' ? '🏷️ ÁNH XẠ BRAND ↔ SÀN' : t === 'motivation' ? '☀️ MOTIVATION & NHẮC NHỞ' : t.toUpperCase()}
                            </button>
                        ))}
                    </div>

                    <div className="bento-card p-8 min-h-[500px]">
                        {activeTab === 'categories' && (
                            <div className="space-y-6">
                                {/* Header & Search Toolbar */}
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-5">
                                    <div>
                                        <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                                            <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                            </svg>
                                            Phân quyền Danh mục ↔ Channel
                                        </h3>
                                        <p className="text-xs text-slate-500 mt-1">Cấu hình kênh chat cho danh mục gốc (danh mục con sẽ tự động áp dụng).</p>
                                    </div>
                                    
                                    <div className="flex items-center gap-3">
                                        {/* Search Filter */}
                                        <div className="relative">
                                            <svg className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                            </svg>
                                            <input 
                                                type="text" 
                                                placeholder="Tìm danh mục gốc..." 
                                                value={catSearchQuery} 
                                                onChange={e => setCatSearchQuery(e.target.value)}
                                                className="pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 w-56 focus:bg-white focus:border-indigo-500 focus:outline-none transition-all"
                                            />
                                        </div>

                                        {/* Refresh Button */}
                                        <button onClick={fetchCategories} disabled={catLoading} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-all flex items-center gap-2 border border-slate-200/60">
                                            <svg className={`w-3.5 h-3.5 ${catLoading ? 'animate-spin text-indigo-600' : 'text-slate-500'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                            </svg>
                                            <span>{catLoading ? 'Đang tải...' : 'Làm mới'}</span>
                                        </button>
                                    </div>
                                </div>

                                {catLoading && categories.length === 0 ? (
                                    <div className="p-12 text-center text-slate-400 font-bold italic flex items-center justify-center gap-3">
                                        <svg className="w-5 h-5 animate-spin text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                        </svg>
                                        <span>Đang tải danh mục từ site Macro...</span>
                                    </div>
                                ) : categories.length === 0 ? (
                                    <div className="p-12 text-center text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                        <p className="font-bold">Chưa tải được danh mục từ site Macro.</p>
                                        <p className="text-xs text-slate-400 mt-1">Vui lòng kiểm tra kết nối với site <code>https://macro.beegadget.net/api/categories</code> và nhấn <i>Làm mới</i>.</p>
                                    </div>
                                ) : (
                                    <div className="overflow-hidden border border-slate-100 rounded-2xl shadow-sm">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50/80 border-b border-slate-100 text-slate-400 text-[11px] font-black uppercase tracking-wider">
                                                    <th className="py-3.5 px-5 w-1/4">Danh Mục Gốc</th>
                                                    <th className="py-3.5 px-5 w-1/5">Phạm Vi Áp Dụng</th>
                                                    <th className="py-3.5 px-5 w-11/20">Kênh Chat / Brand Độc Quyền</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-xs">
                                                {categories
                                                    .filter(cat => !cat.parent)
                                                    .filter(cat => !catSearchQuery.trim() || cat.name.toLowerCase().includes(catSearchQuery.toLowerCase().trim()))
                                                    .map(cat => {
                                                        const isMacroChung = cat.name.toLowerCase().includes('macro chung') || cat.name.toLowerCase() === 'macrochung';
                                                        const m = catMappings[cat._id] || { isAllChannels: isMacroChung, appliedChannels: [] };
                                                        const isAll = m.isAllChannels ?? isMacroChung;
                                                        const appliedList = m.appliedChannels || [];
                                                        const channelsText = appliedList.join(', ');

                                                        // Suggestions based on category name
                                                        const catCleanName = cat.name.trim();
                                                        const suggestions = [
                                                            `${catCleanName} - Shopee`,
                                                            `${catCleanName} - Lazada`,
                                                            `${catCleanName} - Tiktok`
                                                        ];

                                                        return (
                                                            <tr key={cat._id} className="hover:bg-indigo-50/20 transition-colors group">
                                                                {/* Category Name Column */}
                                                                <td className="py-4 px-5">
                                                                    <div className="flex items-center gap-2.5">
                                                                        <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${isMacroChung ? 'bg-indigo-100 text-indigo-600' : 'bg-slate-100 text-slate-500 group-hover:bg-indigo-50 group-hover:text-indigo-600'} transition-colors`}>
                                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                                                                            </svg>
                                                                        </div>
                                                                        <div>
                                                                            <span className={`font-bold text-sm ${isMacroChung ? 'text-indigo-600' : 'text-slate-800'}`}>{cat.name}</span>
                                                                            {isMacroChung ? (
                                                                                <span className="ml-2 inline-flex items-center gap-1 px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-md text-[10px] font-bold border border-indigo-200/50">
                                                                                    Dùng Chung
                                                                                </span>
                                                                            ) : (
                                                                                <div className="text-[11px] text-slate-400 font-medium">Danh mục thương hiệu</div>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                </td>

                                                                {/* Scope / All Channels Switch */}
                                                                <td className="py-4 px-5">
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => toggleAllChannels(cat._id, cat.name)}
                                                                        className={`flex items-center gap-2.5 px-3.5 py-2 rounded-xl border text-xs font-bold transition-all cursor-pointer ${
                                                                            isAll 
                                                                                ? 'bg-emerald-50 text-emerald-700 border-emerald-200 shadow-sm' 
                                                                                : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                                                        }`}
                                                                    >
                                                                        <div className={`w-4 h-4 rounded-full flex items-center justify-center transition-colors ${isAll ? 'bg-emerald-600 text-white' : 'border border-slate-400 bg-white'}`}>
                                                                            {isAll && (
                                                                                <svg className="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
                                                                                </svg>
                                                                            )}
                                                                        </div>
                                                                        <span>{isAll ? 'Tất cả Channel' : 'Chỉ định Channel'}</span>
                                                                    </button>
                                                                </td>

                                                                {/* Interactive Channels Tag & Editor Column */}
                                                                <td className="py-4 px-5">
                                                                    {isAll ? (
                                                                        <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-50/60 text-emerald-700 text-xs font-medium border border-emerald-100">
                                                                            <svg className="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                                                                            </svg>                                                                            <span>Tất cả kênh/nhãn hàng đều nhìn thấy danh mục này</span>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="space-y-2">
                                                                            {/* Active Channel Tag Chips */}
                                                                            {appliedList.length > 0 && (
                                                                                <div className="flex flex-wrap gap-1.5">
                                                                                    {appliedList.map(ch => (
                                                                                        <span key={ch} className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-bold border border-indigo-200/60">
                                                                                            <svg className="w-3 h-3 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                                                                                            </svg>
                                                                                            {ch}
                                                                                            <button 
                                                                                                type="button" 
                                                                                                onClick={() => toggleQuickChannel(cat._id, ch, cat.name)}
                                                                                                className="text-indigo-400 hover:text-indigo-700 ml-0.5"
                                                                                            >
                                                                                                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                                                                                </svg>
                                                                                            </button>
                                                                                        </span>
                                                                                    ))}
                                                                                </div>
                                                                            )}

                                                                            {/* Channel Input Field */}
                                                                            <div className="relative">
                                                                                <input
                                                                                    className="w-full pl-8 pr-3 py-2 text-xs font-medium border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition-all placeholder:text-slate-400"
                                                                                    placeholder="Nhập channel (phân cách bằng dấu phẩy) hoặc chọn gợi ý bên dưới..."
                                                                                    value={rawChannelInputs[cat._id] !== undefined ? rawChannelInputs[cat._id] : channelsText}
                                                                                    onChange={e => updateAppliedChannels(cat._id, e.target.value, cat.name)}
                                                                                />
                                                                                <svg className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
                                                                                </svg>
                                                                            </div>

                                                                            {/* Quick Suggestion Pills */}
                                                                            <div className="flex items-center gap-1.5 pt-0.5">
                                                                                <span className="text-[10px] font-bold text-slate-400">Gợi ý nhanh:</span>
                                                                                {suggestions.map(sugg => {
                                                                                    const isAdded = appliedList.includes(sugg);
                                                                                    return (
                                                                                        <button
                                                                                            key={sugg}
                                                                                            type="button"
                                                                                            onClick={() => toggleQuickChannel(cat._id, sugg, cat.name)}
                                                                                            className={`px-2 py-0.5 rounded text-[10px] font-bold border transition-all cursor-pointer ${
                                                                                                isAdded 
                                                                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' 
                                                                                                    : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-indigo-50 hover:text-indigo-600'
                                                                                            }`}
                                                                                        >
                                                                                            {isAdded ? '✓ ' : '+ '}{sugg}
                                                                                        </button>
                                                                                    );
                                                                                })}
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                        {activeTab === 'motivation' && (
                            <div className="space-y-8">
                                {/* Top Controls & Settings */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    {/* Left Column: General Configuration */}
                                    <div className="lg:col-span-2 space-y-6">
                                        <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                                            <div>
                                                <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                                                    <svg className="w-6 h-6 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                                                    Cấu Hình Khung Motivation Navbar
                                                </h3>

                                            </div>
                                            
                                            {/* Master Enable Switch */}
                                            <div className="flex items-center gap-3 bg-slate-50 p-2.5 px-4 rounded-xl border border-slate-200/70">

                                                <label className="inline-flex relative items-center cursor-pointer">
                                                    <input 
                                                        type="checkbox" 
                                                        className="sr-only peer" 
                                                        checked={motivationConfig.isEnabled} 
                                                        onChange={e => setMotivationConfig({ ...motivationConfig, isEnabled: e.target.checked })} 
                                                    />

                            <div className="p-20 text-center text-slate-400 font-bold italic">ĐANG TẢI LỊCH SỬ...</div>
                        ) : logs.length === 0 ? (
                            <div className="p-20 text-center text-slate-400 font-bold italic">Chưa có nhật ký hoạt động nào ghi nhận</div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b border-slate-100 text-slate-400 text-xs font-bold uppercase tracking-wider">
                                            <th className="pb-4 font-extrabold w-1/4">Thời gian</th>
                                            <th className="pb-4 font-extrabold w-1/6">Hành động</th>
                                            <th className="pb-4 font-extrabold w-1/6">Địa chỉ IP</th>
                                            <th className="pb-4 font-extrabold w-5/12">Nội dung chi tiết</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {logs.map((log) => (
                                            <tr key={log._id} className="hover:bg-slate-50/50 transition-colors duration-200">
                                                <td className="py-4 font-semibold text-slate-650 font-mono text-xs">{formatTime(log.createdAt)}</td>
                                                <td className="py-4">
                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold border ${getActionBadgeClass(log.action)}`}>
                                                        {log.action}
                                                    </span>
                                                </td>
                                                <td className="py-4 text-slate-500 font-mono text-xs">{log.adminIp}</td>
                                                <td className="py-4 text-slate-800 font-medium">{log.details}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
